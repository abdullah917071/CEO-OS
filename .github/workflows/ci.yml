name: CEO-OS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Python Lint, Typecheck & Test Suite
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: |
          uv sync --all-extras

      - name: Ruff Lint & Format Check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Mypy Static Type Analysis
        run: |
          uv run mypy apps/api/src/ceo_os_api core agents tools memory computer browser vision voice

      - name: Pytest Unit & Integration Tests
        run: |
          uv run pytest -q

      - name: Verify Wheel Packaging
        run: |
          uv build
          ls -la dist/

  dashboard-build:
    name: Next.js Dashboard Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Install Dashboard dependencies
        working-directory: apps/dashboard
        run: npm ci

      - name: Next.js Production Build
        working-directory: apps/dashboard
        run: npm run build
