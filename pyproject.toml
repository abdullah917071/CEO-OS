[project]
name = "ceo-os"
version = "0.1.0"
description = "Local-first personal AI operating system"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "aiosqlite>=0.20,<1",
  "asyncpg>=0.30,<1",
  "fastapi>=0.116,<1",
  "greenlet>=3.2,<4",
  "httpx>=0.28,<1",
  "langgraph>=1.2,<1.3",
  "langgraph-checkpoint-postgres>=3.0,<4",
  "langgraph-checkpoint-sqlite>=3.0,<4",
  "mcp>=2,<3",
  "pgvector>=0.4,<1",
  "cua-driver>=0.8.3,<1",
  "playwright>=1.55,<2",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "redis>=6,<7",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
  "websockets>=15,<16",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "core", "agents", "tools", "integrations", "memory", "computer", "browser", "vision", "voice", "communications", "skills"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["apps.api.src.ceo_os_api", "core", "agents", "tools", "memory", "computer", "browser", "vision", "voice"]
